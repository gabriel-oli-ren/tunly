name: tunely
description: "Tunely - Premium Music Streaming App with Liquid Glass UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Liquid Glass Renderer for iOS
  liquid_glass_renderer: ^0.2.0-dev.4
  
  # YouTube audio streaming
  youtube_player_flutter: ^8.1.2
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Network
  http: ^1.1.0
  
  # Icons
  flutter_svg: ^2.0.9
  
  # Animations
  flutter_animate: ^4.3.0
  
  # iOS-specific
  url_launcher: ^6.2.2
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700
