name: tunly
description: A free music discovery and streaming app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  cupertino_native: 0.1.1
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  http: 1.3.0
  url_launcher: 6.3.2
  youtube_player_iframe: 6.0.2
  hive_flutter: 1.1.0
  palette_generator: 0.3.3+7
  geolocator: 14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
